root_dir: "."
data_dir: "{{ root_dir }}/data"
external_data_dir: "{{ data_dir }}/external"
log_dir: "{{ root_dir }}/logs"
db_name: 'MatDB'
n_cores: 

numpy_config:
  np_printoptions:
    linewidth:  400
    precision: 3

pandas_config:
  display:
    max_columns:
    max_rows: 
    max_colwidth:

matdb_config:
  normalize_kwargs:
    load_kwargs:
      batch_readahead: 16
      fragment_readahead: 4
      batch_size: 131072
    use_threads: True
    max_partitions: 1024
    max_open_files: 1024
    max_rows_per_file: 1000000
    min_rows_per_group: 0
    max_rows_per_group: 1000000
    existing_data_behavior: overwrite_or_ignore
    create_dir: True
  load_kwargs:
    batch_readahead: 16
    fragment_readahead: 4
    batch_size: 131072



logging_config:
  version: 1
  disable_existing_loggers: False

  formatters:
    simple:
      format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
      datefmt: '%Y-%m-%d %H:%M:%S'

    user:
      format: '%(message)s'
      datefmt: '%Y-%m-%d %H:%M:%S'

  handlers:
    dev_console:
      class: logging.StreamHandler
      formatter: simple
      stream: ext://sys.stdout

    user_console:
      class: logging.StreamHandler
      formatter: user
      stream: ext://sys.stdout


    file:
      class: logging.FileHandler
      formatter: simple
      filename: "{{ log_dir }}/matdb.log"
      level: DEBUG
      mode: a

  loggers:
    matdb:
      level: INFO
      handlers: [user_console,file]
      propagate: no
    parquetdb:
      level: CRITICAL
      handlers: [dev_console]
      propagate: no
    timing:
      level: DEBUG
      handlers: [file]
      propagate: no
    tests:
      level: DEBUG
      handlers: [file]
      propagate: no


  # root:
  #   level: INFO
  #   handlers: [console]
  #   propagate: no
